name: Hourly Feature Extraction

on:
  schedule:
    - cron: '0 * * * *'  # Runs every hour
  workflow_dispatch:  # Allow manual trigger

jobs:
  run-feature-script:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: Install dependencies
      run: |
        pip install -r requirements.txt
        pip install hopsworks openmeteo-requests retry-requests pandas numpy scikit-learn joblib requests-cache

    - name: Run feature extraction pipeline
      run: |
        python -c "
from fetch_data import fetch_openmeteo_data
from compute_targets import compute_features_targets
from store_features import store_in_feature_store

df = fetch_openmeteo_data()
X, y, full_df = compute_features_targets(df)
store_in_feature_store(full_df, y)
"
